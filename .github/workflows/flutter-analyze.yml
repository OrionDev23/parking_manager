name: Flutter analysis

on:
  push:
    branches:
      - refactor/foundation-v1
  pull_request:
    branches:
      - refactor/foundation-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Validate Appwrite function syntax
        run: node --check appwrite/functions/company-tenant-api/src/index.js
